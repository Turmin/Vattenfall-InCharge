name: Deploy website via FTPS

on:
  push:
    branches:
      - main
      - development
  workflow_dispatch:

jobs:
  deploy:
    name: Upload website
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Prepare deploy folder
        run: |
          mkdir -p .deploy

          rsync -av \
            --exclude='.env' \
            --exclude='*.sql' \
            --exclude='*.zip' \
            --exclude='*.tar' \
            --exclude='*.tar.gz' \
            --exclude='*.bak' \
            --exclude='*.backup' \
            --exclude='*.old' \
            --exclude='*.log' \
            --exclude='*.txt' \
            --include='*/' \
            --include='*.php' \
            --include='*.html' \
            --include='*.ico' \
            --include='*.png' \
            --include='favo.json' \
            --include='robots.txt' \
            --include='.htaccess' \
            --include='sw.js' \
            --include='site.webmanifest' \
            --include='manifest.json' \
            --include='css/***' \
            --include='js/***' \
            --include='images/***' \
            --include='admin/***' \
            --include='api/***' \
            --include='doc/***' \
            --include='lib/***' \
            --include='models/***' \
            --exclude='*' \
            ./ .deploy/

      - name: Write admin IP restriction
        env:
          ADMIN_ALLOWED_IP: ${{ secrets.ADMIN_ALLOWED_IP }}
        run: |
          if ! [[ "$ADMIN_ALLOWED_IP" =~ ^([0-9]{1,3}\.){3}[0-9]{1,3}$ ]]; then
            echo "Set the ADMIN_ALLOWED_IP secret to the IPv4 address that may open /admin." >&2
            exit 1
          fi
          sed -i "s/__ADMIN_ALLOWED_IP__/${ADMIN_ALLOWED_IP//./\\\\.}/" ".deploy/admin/.htaccess"
          if grep -q '__ADMIN_ALLOWED_IP__' ".deploy/admin/.htaccess"; then
            echo "Could not write the admin IP restriction." >&2
            exit 1
          fi

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./.deploy/
          server-dir: ${{ secrets.FTP_REMOTE_DIR }}